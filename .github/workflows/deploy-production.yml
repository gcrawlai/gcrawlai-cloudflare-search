name: Deploy Worker to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcrawlai-search-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Validate required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GC_KEY: ${{ secrets.GCRAWLAI_API_KEY }}
          PROXY_TOKEN: ${{ secrets.PROXY_AUTH_TOKEN }}
        run: |
          for value in "$CF_TOKEN" "$CF_ACCOUNT" "$GC_KEY" "$PROXY_TOKEN"; do
            if [ -z "$value" ]; then
              echo "::error::Missing required production secret."
              exit 1
            fi
          done
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Set upstream API key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.GCRAWLAI_API_KEY }}
        run: printf '%s' "$SECRET_VALUE" | npx --yes wrangler@4 secret put GCRAWLAI_API_KEY
      - name: Set proxy authorization token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.PROXY_AUTH_TOKEN }}
        run: printf '%s' "$SECRET_VALUE" | npx --yes wrangler@4 secret put PROXY_AUTH_TOKEN
